
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14283d">
  <title>全国鉄道運行情報</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: #172b42;
    }
    header {
      background: #14283d;
      color: white;
      padding: 28px 18px;
    }
    header h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; color: #d4e3f1; }
    main { max-width: 760px; margin: auto; padding: 18px; }
    .notice {
      background: #fff4d6; color: #75520a; padding: 12px;
      border-radius: 10px; font-size: 14px; margin-bottom: 18px;
    }
    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .stat, .panel, .route, .detail {
      background: white; border-radius: 12px; padding: 16px;
      box-shadow: 0 2px 8px #14283d0d;
    }
    .stat span { display: block; font-size: 12px; }
    .stat strong { display: block; font-size: 27px; margin-top: 8px; }
    h2 { font-size: 19px; margin-top: 0; }
    input, select, button {
      width: 100%; padding: 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 16px; margin-top: 8px;
      background: white;
    }
    button {
      background: #1768ac; color: white; border: 0; font-weight: 600;
      cursor: pointer;
    }
    .route-list { display: grid; gap: 12px; margin-top: 12px; }
    .route h3 { margin: 0 0 8px; }
    .route-button {
      text-align: left; color: #172b42; background: white;
      border: 1px solid #dbe4ee; padding: 16px;
    }
    .route-button:focus { outline: 3px solid #8ec5ff; }
    .status { font-weight: 700; color: #64748b; }
    .muted { color: #64748b; font-size: 13px; }
    .detail { margin-top: 18px; border: 2px solid #1768ac; }
    .detail h2 { margin-bottom: 12px; }
    [hidden] { display: none !important; }
    footer { padding: 20px 0; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>🚆 全国鉄道運行情報</h1>
    <p>全国の鉄道の運行状況をチェック</p>
  </header>
  <main>
    <div class="notice">
      開発中の試作版です。運行状況はサンプルで、実際の運行情報ではありません。
    </div>

    <section class="stats">
      <div class="stat"><span>平常（サンプル）</span><strong id="normal">0</strong></div>
      <div class="stat"><span>遅延（サンプル）</span><strong id="delay">0</strong></div>
      <div class="stat"><span>見合わせ（サンプル）</span><strong id="suspended">0</strong></div>
    </section>

    <section class="panel">
      <h2>運行情報を検索</h2>
      <input id="search" type="search" placeholder="路線名・鉄道会社・地域">
      <select id="filter">
        <option value="all">すべての状態</option>
        <option value="normal">平常</option>
        <option value="delay">遅延</option>
        <option value="suspended">運転見合わせ</option>
        <option value="unknown">情報なし</option>
      </select>
      <button id="refresh">表示を更新</button>
      <p id="updated" class="muted">サンプルデータを表示中</p>
    </section>

    <h2 style="margin-top:24px">路線一覧 <span id="count" class="muted"></span></h2>
    <div id="routes" class="route-list"></div>

    <section id="routeDetail" class="detail" hidden aria-live="polite">
      <h2 id="detailName">路線の詳細</h2>
      <p id="detailCompany"></p>
      <p id="detailArea"></p>
      <p id="detailStatus" class="status"></p>
      <p id="detailText"></p>
      <button id="closeDetail">詳細を閉じる</button>
    </section>

    <footer>
      このサイトは試作版です。乗車前には各鉄道会社の公式情報をご確認ください。
    </footer>
  </main>

  <script>
    const sampleRoutes = [
      {name:"山手線", company:"JR東日本", area:"関東", status:"normal", detail:"サンプル表示：平常"},
      {name:"中央線快速", company:"JR東日本", area:"関東", status:"delay", detail:"サンプル表示：遅延"},
      {name:"東海道新幹線", company:"JR東海", area:"東海・関東・関西", status:"normal", detail:"サンプル表示：平常"},
      {name:"大阪環状線", company:"JR西日本", area:"関西", status:"suspended", detail:"サンプル表示：運転見合わせ"}
    ];

    const labels = {
      normal:"平常（サンプル）",
      delay:"遅延（サンプル）",
      suspended:"運転見合わせ（サンプル）",
      unknown:"情報なし"
    };

    const routesEl = document.getElementById("routes");
    const detailEl = document.getElementById("routeDetail");

    function showDetail(route) {
      document.getElementById("detailName").textContent = route.name;
      document.getElementById("detailCompany").textContent = "鉄道会社：" + route.company;
      document.getElementById("detailArea").textContent = "地域：" + route.area;
      document.getElementById("detailStatus").textContent = labels[route.status] || labels.unknown;
      document.getElementById("detailText").textContent =
        route.detail + "。これはサンプル情報で、実際の運行状況ではありません。";
      detailEl.hidden = false;
      detailEl.scrollIntoView({behavior:"smooth", block:"nearest"});
    }

    function render() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const f = document.getElementById("filter").value;

      const list = sampleRoutes.filter(r =>
        (f === "all" || r.status === f) &&
        (r.name + r.company + r.area).toLowerCase().includes(q)
      );

      routesEl.replaceChildren();

      if (list.length) {
        list.forEach(route => {
          const button = document.createElement("button");
          button.className = "route-button";
          button.type = "button";

          const title = document.createElement("h3");
          title.textContent = route.name;

          const company = document.createElement("div");
          company.textContent = route.company + " ・ " + route.area;

          const status = document.createElement("p");
          status.className = "status";
          status.textContent = labels[route.status] || labels.unknown;

          const hint = document.createElement("div");
          hint.className = "muted";
          hint.textContent = "タップして詳細を見る";

          button.append(title, company, status, hint);
          button.addEventListener("click", () => showDetail(route));
          routesEl.appendChild(button);
        });
      } else {
        const message = document.createElement("p");
        message.textContent = "該当する路線がありません。";
        routesEl.appendChild(message);
      }

      document.getElementById("count").textContent = list.length + "路線";
      document.getElementById("normal").textContent =
        sampleRoutes.filter(r => r.status === "normal").length;
      document.getElementById("delay").textContent =
        sampleRoutes.filter(r => r.status === "delay").length;
      document.getElementById("suspended").textContent =
        sampleRoutes.filter(r => r.status === "suspended").length;
    }

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("filter").addEventListener("change", render);

    document.getElementById("refresh").addEventListener("click", () => {
      document.getElementById("updated").textContent =
        "表示を更新しました（サンプルデータ）";
      detailEl.hidden = true;
      render();
    });

    document.getElementById("closeDetail").addEventListener("click", () => {
      detailEl.hidden = true;
    });

    render();
  </script>
</body>
</html>
